[project]
name = "moyu-salary"
version = "2.0.0"
description = "摸鱼助手 — 时薪计算与 AI 摸鱼伴侣"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28",
    "chinese-calendar>=1.9",
    "pandas>=2.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
